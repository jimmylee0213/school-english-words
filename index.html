<html lang="ko">
<head>

<style id="app-style">
/* Layout: 한 열짜리 공부 공책. 홈(오늘의 공부 체크 + 달력 + 단어장) → 읽기 / 받아쓰기 / 문장 만들기. 품사마다 고정 색. */
:root {
  --bg: #EAF2FB; --surface: #FFFFFF; --ink: #1B2A44; --muted: #5A6A86; --line: #D3DFEE;
  --sun: #FFC23A; --sun-ink: #5A3D00; --sun-soft: #FFF1C9;
  --noun: #2F6FE4; --verb: #E0464C; --adj: #2A9A57; --adv: #8B5CD6; --etc: #6B7A92;
  --good: #2A9A57; --good-bg: #E3F6EA; --bad-bg: #FDE8E8; --bad: #D33A40;
  --display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --body: "Gowun Dodum", system-ui, sans-serif;
  --word: "Fredoka", "Jua", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111A2A; --surface: #1A2538; --ink: #EAF0FA; --muted: #9AA9C2; --line: #2B3A53;
  --sun: #FFD15C; --sun-ink: #2A1E00; --sun-soft: #3D3315;
  --noun: #6E9DFF; --verb: #FF7B80; --adj: #4CC985; --adv: #B593F2; --etc: #94A3BB;
  --good: #4CC985; --good-bg: #173A27; --bad-bg: #4A2226; --bad: #FF7B80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111A2A; --surface: #1A2538; --ink: #EAF0FA; --muted: #9AA9C2; --line: #2B3A53;
  --sun: #FFD15C; --sun-ink: #2A1E00; --sun-soft: #3D3315;
  --noun: #6E9DFF; --verb: #FF7B80; --adj: #4CC985; --adv: #B593F2; --etc: #94A3BB;
  --good: #4CC985; --good-bg: #173A27; --bad-bg: #4A2226; --bad: #FF7B80; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
h1, h2, .display { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; line-height: 1.2; }
h2 { font-size: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--noun); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; }
.chip { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px;
  font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.label { font-size: 14px; color: var(--muted); letter-spacing: .02em; }
.note { font-size: 13px; color: var(--muted); }
.center { text-align: center; }
.msg-box { background: var(--sun-soft); border-radius: 14px; padding: 10px 14px; }
.err-box { background: var(--bad-bg); border-radius: 14px; padding: 10px 14px; }
.store.ok { font-size: 13px; color: var(--good); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.store-bad { display: flex; flex-direction: column; gap: 6px; border: 2px solid var(--bad); }
.toast { background: var(--sun); color: var(--sun-ink); border-radius: 14px; padding: 10px 14px; font-family: var(--display); font-size: 18px; text-align: center; }
.hits { color: var(--muted); font-size: 12px; }

.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-family: var(--display); font-size: 18px; background: var(--sun); color: var(--sun-ink); }
.btn.ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.small { padding: 7px 12px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: default; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* 체크 버튼 (모든 단계 공통) */
.check { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface);
  border: 2.5px solid var(--line); border-radius: 16px; padding: 12px 14px; font-family: var(--display); font-size: 18px; }
.check .box { flex: none; width: 32px; height: 32px; border-radius: 10px; border: 2.5px solid var(--line); display: grid; place-items: center; font-size: 20px; color: #fff; }
.check[aria-pressed="true"] { border-color: var(--good); background: var(--good-bg); }
.check[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); }
.check:disabled { opacity: .45; cursor: default; }
.check small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); }

/* 오늘의 공부 */
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; background: var(--surface);
  border: 2.5px solid var(--line); border-radius: 16px; padding: 12px 14px; text-align: left; }
.step .box { width: 32px; height: 32px; border-radius: 10px; border: 2.5px solid var(--line); display: grid; place-items: center; font-size: 20px; color: #fff; }
.step.done { border-color: var(--good); background: var(--good-bg); }
.step.done .box { background: var(--good); border-color: var(--good); }
.step .name { font-family: var(--display); font-size: 19px; }
.step .sub { font-size: 13px; color: var(--muted); }
.step .go { font-family: var(--display); color: var(--muted); font-size: 15px; }

/* 달력 */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-nav { border: 2px solid var(--line); background: transparent; border-radius: 10px; width: 36px; height: 32px; font-size: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.cal .dow.sun, .cal .d.sun .n { color: var(--bad); }
.cal .d { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; position: relative; font-variant-numeric: tabular-nums; }
.cal .d .mark { font-size: 15px; line-height: 1; height: 16px; }
.cal .d.some { background: var(--good-bg); }
.cal .d.full { background: var(--sun); color: var(--sun-ink); }
.cal .d.full .n { color: var(--sun-ink); }
.cal .d.miss .mark { color: var(--muted); opacity: .6; }
.cal .d.today { outline: 2.5px solid var(--noun); outline-offset: -2px; }
.cal .d.future { color: var(--muted); opacity: .6; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }

/* 단어장 */
.wordlist { display: flex; flex-wrap: wrap; gap: 6px; }
.wl { border: 1.5px solid var(--line); border-radius: 10px; padding: 3px 10px; font-size: 14px; background: transparent; }
.wl b { font-family: var(--word); font-weight: 600; }
.edit-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.edit-row input { min-width: 0; width: 100%; font-size: 16px; padding: 7px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.edit-row input.en { font-family: var(--word); font-weight: 600; }
.edit-row.gone input { text-decoration: line-through; opacity: .45; }
.edit-row .del { border: 0; background: transparent; color: var(--muted); font-size: 15px; padding: 6px; font-family: var(--display); }
.notebook { display: flex; flex-direction: column; gap: 6px; }
.nb { border-left: 4px solid var(--sun); padding: 2px 10px; background: transparent; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; }
.nb .s { font-family: var(--word); font-weight: 500; font-size: 17px; overflow-wrap: anywhere; }

/* 공부 화면 */
.qbar { display: flex; align-items: center; gap: 12px; }
.x { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 12px; font-size: 14px; }
.progress { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--sun); border-radius: 999px; transition: width .3s; }
.count { font-family: var(--display); font-variant-numeric: tabular-nums; }
.tag { align-self: flex-start; background: var(--sun-soft); border-radius: 999px; padding: 3px 12px; font-family: var(--display); font-size: 15px; }
.tag.red { background: var(--bad-bg); }
.qcard { background: var(--surface); border-radius: 22px; padding: 22px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; border: 2px solid var(--line); }
.badge { border-radius: 999px; padding: 2px 12px; font-family: var(--display); font-size: 15px; color: #fff; background: var(--c); }
.prompt { font-size: 46px; line-height: 1.15; overflow-wrap: anywhere; font-family: var(--word); font-weight: 600; }
.ko-text { font-family: var(--display); font-size: 26px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tool { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.tool:disabled { opacity: .45; }
.dots { display: flex; gap: 10px; justify-content: center; }
.dot { width: 52px; height: 52px; border-radius: 50%; border: 3px dashed var(--line); background: transparent; font-size: 24px; color: #fff; display: grid; place-items: center; }
.dot.on { background: var(--good); border: 3px solid var(--good); }
.dot:disabled { cursor: default; }
.dot:not(.on) { color: var(--muted); font-family: var(--display); font-size: 20px; }
.example { background: var(--sun-soft); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.example .en-s { font-family: var(--word); font-weight: 500; font-size: 21px; line-height: 1.35; }
.example .en-s mark { background: transparent; color: var(--c); font-weight: 600; }
.example .ko-s { font-size: 15px; color: var(--muted); }
.feel { border: 2px dashed var(--sun); border-radius: 16px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.feel .t { font-family: var(--display); font-size: 16px; }
.locked { opacity: .4; pointer-events: none; }
textarea { width: 100%; min-height: 96px; resize: vertical; font-family: var(--word); font-weight: 500; font-size: 20px; padding: 12px 14px;
  border-radius: 14px; border: 2.5px solid var(--line); background: var(--surface); color: var(--ink); }

.cover { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; padding: 12px 14px; border-radius: 14px; background: var(--c); }
.cover span { width: 26px; height: 34px; border-radius: 6px; background: rgba(255,255,255,.28); display: grid; place-items: center;
  font-family: var(--word); font-weight: 600; font-size: 22px; color: #fff; }
.cover span.gap { background: transparent; width: 10px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.mode .name { font-family: var(--display); font-size: 18px; }
.mode .sub { font-size: 13px; color: var(--muted); }
.answer { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; color: var(--muted); }
.field input { width: 100%; font-size: 24px; padding: 12px 14px; border-radius: 14px; border: 2.5px solid var(--line); background: var(--surface); color: var(--ink); }
.field input.en { font-family: var(--word); font-weight: 600; }
.field input.ko { font-family: var(--display); }
.field.bad input { border-color: var(--bad); background: var(--bad-bg); }
.field.good input { border-color: var(--good); background: var(--good-bg); }
.feedback { border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.feedback.good { background: var(--good-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback .msg { font-family: var(--display); font-size: 20px; }
.compare { font-family: var(--word); font-size: 22px; font-weight: 600; letter-spacing: 2px; }
.compare .miss { color: var(--bad); text-decoration: underline; text-underline-offset: 4px; }
.compare-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.def-text { font-family: var(--word); font-weight: 500; font-size: 24px; line-height: 1.35; overflow-wrap: anywhere; }
.flabel { font-size: 14px; color: var(--muted); }
.picks { display: flex; gap: 8px; flex-wrap: wrap; }
.pick { flex: 1 1 22%; min-width: 72px; border: 2.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 6px; font-family: var(--display); font-size: 17px; }
.pick[aria-pressed="true"] { border-color: var(--noun); background: var(--sun-soft); }
.pick:disabled { cursor: default; }
.field.bad .pick[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-bg); }
.field.good .pick[aria-pressed="true"] { border-color: var(--good); background: var(--good-bg); }
.result { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 24px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.score { border: 2px solid var(--line); border-radius: 16px; padding: 12px 8px; }
.big { font-family: var(--display); font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stars { font-size: 26px; letter-spacing: 3px; overflow-wrap: anywhere; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.field.bad input { animation: shake .25s; }
@keyframes pop { 0% { transform: scale(.5) } 70% { transform: scale(1.15) } 100% { transform: scale(1) } }
.dot.on, .check[aria-pressed="true"] .box { animation: pop .25s ease-out; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 400px) { .modes { grid-template-columns: 1fr; } .prompt { font-size: 38px; } .cover span { width: 22px; height: 30px; font-size: 19px; } .dot { width: 46px; height: 46px; } }
</style>

<script id="app-script">
/* 아이패드용 앱 (GitHub Pages). 단어는 words.js 에 있고 Claude가 업데이트해요.
   이 사이트는 독립된 주소라서, 홈 화면 아이콘으로 열어도 공부 기록이 아이패드 안에 계속 남아요. */
const APP_VERSION = "20261103-200522";   // 올릴 때마다 sync-kid-words.ps1이 바꿔요 (version.json과 같아야 해요)
const DATA = window.WORDS_DATA || { words: [] };   // words.js 에서 읽어요
const WORDS = (DATA.words || []).filter(w => w && w.en && w.ko);

const POS = {
  n:    { ko: "명사",   en: "n",    c: "--noun" },
  v:    { ko: "동사",   en: "v",    c: "--verb" },
  a:    { ko: "형용사", en: "adj",  c: "--adj" },
  adv:  { ko: "부사",   en: "adv",  c: "--adv" },
  prep: { ko: "전치사", en: "prep", c: "--etc" },
  pron: { ko: "대명사", en: "pron", c: "--etc" },
  etc:  { ko: "기타",   en: "etc",  c: "--etc" }
};
const POS_ALIAS = {
  n: "n", noun: "n", 명사: "n", v: "v", verb: "v", 동사: "v", a: "a", adj: "a", adjective: "a", 형용사: "a",
  adv: "adv", adverb: "adv", 부사: "adv", prep: "prep", 전치사: "prep", pron: "pron", 대명사: "pron"
};
const GOOD = ["Great job!", "Awesome!", "Perfect!", "You did it!", "Super!"];
const KEY = "school-english-words-v2";
const READ_TIMES = 3, READ_ROUND = 10, QUIZ_ROUND = 10, SENT_ROUND = 3;

/* ---------- 기기 안 기록 ---------- */
function load() {
  const base = { stars: 0, days: {}, reads: {}, wrong: {}, notes: [], mastered: {}, hits: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return { ...base, ...s }; } catch (e) {}
  return base;
}
// 저장이 되는지 검사: 이 기기(브라우저)가 기록 저장을 막으면 storeOk = false
let storeOk = (() => {
  try { localStorage.setItem("sew-test", "1"); const ok = localStorage.getItem("sew-test") === "1"; localStorage.removeItem("sew-test"); return ok; } catch (e) { return false; }
})();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); if (!storeOk) { storeOk = true; } }
  catch (e) { storeOk = false; }
}
let S = load();
if (storeOk && !S.since) { S.since = new Date().toISOString().slice(0, 10); save(); }

const app = document.getElementById("app");
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dkey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const TODAY = () => dkey(new Date());
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const posOf = (w) => POS[w.pos] || POS.etc;
const colorOf = (w) => `var(${posOf(w).c})`;
const wid = (w) => w.id || w.en.toLowerCase();

/* ---------- 외운 단어 보관함 ---------- */
// 받아쓰기에서 3번 연속 한 번에 맞히거나, 읽기 화면에서 '다 외웠어요'를 누르면 보관함으로 옮겨요
const MASTER_HITS = 3, BOX_ROUND = 10;
const isM = (w) => !!S.mastered[wid(w)];
const ACTIVE = () => WORDS.filter(w => !isM(w));
const MASTERED = () => WORDS.filter(isM);
function master(w) { S.mastered[wid(w)] = TODAY(); S.hits[wid(w)] = 0; delete S.wrong[wid(w)]; save(); }
function unmaster(w) { delete S.mastered[wid(w)]; S.hits[wid(w)] = 0; save(); }

// 가장 최근에 올린 단어부터, 매번 순서를 섞어서 n개 고르기
const newestDay = (list) => list.reduce((m, w) => ((w.added || "") > m ? w.added : m), "");
function freshFirst(list, n) {
  const day = newestDay(list);
  const fresh = shuffle(list.filter(w => (w.added || "") === day)), rest = shuffle(list.filter(w => (w.added || "") !== day));
  return fresh.concat(rest).slice(0, n);
}

function today() { const k = TODAY(); return S.days[k] || (S.days[k] = { read: false, quiz: false, sent: false }); }
function markDay(step) { today()[step] = true; save(); }
const dayLevel = (d) => !d ? 0 : (d.read && d.quiz && d.sent ? 2 : (d.read || d.quiz || d.sent || d.rev ? 1 : 0));
function streak() {
  const d = new Date(); let n = 0;
  if (!dayLevel(S.days[dkey(d)])) d.setDate(d.getDate() - 1);
  while (dayLevel(S.days[dkey(d)])) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- 소리 ---------- */
function hasVoice(lang) { try { const v = speechSynthesis.getVoices(); return !v.length || v.some(x => (x.lang || "").toLowerCase().startsWith(lang)); } catch (e) { return false; } }
function speak(text, lang) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang === "ko" ? "ko-KR" : "en-US"; u.rate = lang === "ko" ? 0.9 : 0.8;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const sayKo = (w) => speak(w.ko.replace(/\(.*?\)/g, ""), "ko");
const markWord = (s, w) => esc(s).replace(new RegExp("\\b(" + w.en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").slice(0, Math.max(3, w.en.length - 2)) + "[a-z]*)", "i"), "<mark>$1</mark>");

function calendarHtml() {
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth() + ui.calOffset, 1);
  const y = first.getFullYear(), m = first.getMonth(), days = new Date(y, m + 1, 0).getDate(), tk = TODAY();
  const since = Object.keys(S.days).filter(k => dayLevel(S.days[k])).sort()[0] || tk;   // 처음 공부한 날부터 '안 한 날' 표시
  let cells = ["일", "월", "화", "수", "목", "금", "토"].map((d, i) => `<div class="dow${i ? "" : " sun"}">${d}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) cells += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, m, d), k = dkey(date), lv = dayLevel(S.days[k]);
    const future = k > tk, isToday = k === tk, miss = !future && !isToday && k >= since;
    const cls = ["d", date.getDay() ? "" : "sun", lv === 2 ? "full" : lv === 1 ? "some" : (miss ? "miss" : ""), isToday ? "today" : "", future ? "future" : ""].join(" ");
    const mark = lv === 2 ? "⭐" : lv === 1 ? "✔" : (miss ? "·" : "");
    cells += `<div class="${cls}" title="${k}"><span class="n">${d}</span><span class="mark">${mark}</span></div>`;
  }
  const studied = Object.keys(S.days).filter(k => k.startsWith(`${y}-${String(m + 1).padStart(2, "0")}`) && dayLevel(S.days[k])).length;
  return `
    <div class="panel">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="지난달">‹</button>
        <div class="center"><h2>${y}년 ${m + 1}월</h2><span class="note">공부한 날 ${studied}일</span></div>
        <button class="cal-nav" id="cal-next" aria-label="다음 달" ${ui.calOffset >= 0 ? "disabled" : ""}>›</button>
      </div>
      <div class="cal">${cells}</div>
      <div class="legend"><span><i style="background:var(--sun)"></i>3가지 다 함 ⭐</span><span><i style="background:var(--good-bg)"></i>조금 함 ✔</span><span>· 안 한 날</span></div>
    </div>`;
}

let R = null;
function readQueue() { return freshFirst(ACTIVE(), READ_ROUND); }
function startRead() { const items = readQueue(); if (!items.length) return; R = { items, i: 0, count: 0, ex: 0, stars: 0 }; readCard(true); }
// 크게 읽기 1·2·3: 읽을 때마다 다음 동그라미를 누르고, 마지막으로 누른 동그라미를 다시 누르면 취소돼요
const dotRow = (id, count, label, off) => `<div class="dots" id="${id}">${Array.from({ length: READ_TIMES }, (_, k) =>
  `<button class="dot${k < count ? " on" : ""}" data-k="${k}" ${off || (k !== count && k !== count - 1) ? "disabled" : ""} aria-label="${label} ${k + 1}번째 읽기">${k < count ? "✓" : k + 1}</button>`).join("")}</div>
  ${count >= READ_TIMES ? `<span class="display" style="color:var(--good)">크게 읽기 ✓</span>` : ""}`;
const dotStep = (b, count) => (+b.dataset.k < count ? count - 1 : count + 1);
function readCard(first) {
  ui.screen = "read";
  const w = R.items[R.i], n = R.items.length, p = posOf(w), c = colorOf(w);
  const all = R.count >= READ_TIMES, last = R.i === n - 1;
  const toast = ui.toast; ui.toast = "";
  app.replaceChildren($(`
    ${bar(R.i, n, "1. 소리 내어 읽기")}
    ${toast ? `<div class="toast" role="status">${esc(toast)}</div>` : ""}
    <div class="qcard">
      <span class="badge" style="--c:${c}">${p.ko}</span>
      <div class="prompt">${esc(w.en)}</div>
      <div class="ko-text">${esc(w.ko)}</div>
      <div class="tools"><button class="tool" id="say">🔊 발음 듣기</button></div>
    </div>
    <div class="panel center">
      <span class="display" style="font-size:18px">크게 ${READ_TIMES}번 읽고, 읽을 때마다 동그라미를 눌러요</span>
      ${dotRow("word-dots", R.count, "단어")}
    </div>
    <div class="panel ${all ? "" : "locked"}" id="ex-panel">
      <div class="row"><h2>예문도 크게 ${READ_TIMES}번 읽어요</h2><button class="tool" id="say-ex">🔊 예문 듣기</button></div>
      <div class="example" style="--c:${c}">
        <span class="en-s">${w.ex ? markWord(w.ex, w) : esc(w.en)}</span>
        ${w.exKo ? `<span class="ko-s">${esc(w.exKo)}</span>` : ""}
      </div>
      <span class="note center">읽을 때마다 동그라미를 눌러요</span>
      ${dotRow("ex-dots", R.ex, "예문")}
    </div>
    <button class="btn" id="next" ${all && R.ex >= READ_TIMES ? "" : "disabled"}>${last ? "읽기 끝!" : "다음 단어 ›"}</button>
    <button class="btn ghost small" id="know" style="align-self:center">🏆 이 단어는 다 외웠어요 (보관함으로)</button>
  `));
  document.getElementById("quit").onclick = home;
  document.getElementById("say").onclick = () => speak(w.en, "en");
  document.getElementById("say-ex").onclick = () => speak(w.ex || w.en, "en");
  app.querySelectorAll("#word-dots .dot").forEach(b => b.onclick = () => { const up = +b.dataset.k >= R.count; R.count = dotStep(b, R.count); if (R.count < READ_TIMES) R.ex = 0; if (up) speak(w.en, "en"); readCard(); });
  app.querySelectorAll("#ex-dots .dot").forEach(b => b.onclick = () => { R.ex = dotStep(b, R.ex); readCard(); });
  const advance = () => {
    const r = S.reads[wid(w)] || (S.reads[wid(w)] = { n: 0 });
    r.n++; r.last = TODAY(); S.stars++; R.stars++; save();
    if (!last) { R.i++; R.count = 0; R.ex = 0; readCard(true); return; }
    markDay("read");
    doneScreen("소리 내어 읽기 끝!", `단어 ${n}개와 예문을 ${READ_TIMES}번씩 읽었어요.${R.known ? ` 🏆 ${R.known}개는 외운 단어 보관함에 저장했어요.` : ""}`, R.stars);
  };
  document.getElementById("next").onclick = advance;
  document.getElementById("know").onclick = () => {
    master(w); R.known = (R.known || 0) + 1;
    ui.toast = `🏆 '${w.en}'을(를) 외운 단어 보관함에 저장했어요!`;
    if (last) ui.msg = ui.toast;
    advance();
  };
  if (first) speak(w.en, "en");
}

/* ---------- 2. 받아쓰기 ---------- */
let Q = null;
const normEn = (s) => s.toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
const normKo = (s) => s.replace(/\(.*?\)/g, "").replace(/[\s.~!]/g, "");
const koOk = (input, ko) => { const v = normKo(input); return !!v && ko.split(/[,/;·]/).some(m => normKo(m) === v); };
const posOk = (input, pos) => POS_ALIAS[input.toLowerCase().replace(/[\s.]/g, "")] === pos;
function compareHtml(user, ans) {
  const a = normEn(user), b = ans;
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j].toLowerCase() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Array(b.length).fill(false); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j].toLowerCase()) { hit[j] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return [...b].map((ch, k) => hit[k] ? esc(ch) : `<span class="miss">${esc(ch)}</span>`).join("");
}

function startQuiz(mode, items, box) {

// 랜덤 복습("def"): 영어 풀이를 보고 영어 단어 + 한글 뜻을 쓰고, 품사는 골라요. 풀이가 없는 단어는 '보고 뜻 쓰기'로
const qmode = (w) => (Q.mode === "def" && !w.def ? "see" : Q.mode);
const PICKS = ["n", "v", "a", "adv"];
const defFields = (w) => `
  <div class="field" id="f-en"><label for="ans-en">영어 단어</label><input id="ans-en" class="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></div>
  <div class="field" id="f-ko"><label for="ans-ko">한글 뜻</label><input id="ans-ko" class="ko" autocomplete="off" enterkeyhint="done"></div>

    `<button type="button" class="pick" data-p="${k}" aria-pressed="${Q.posPick === k}">${POS[k].ko} ${POS[k].en}</button>`).join("")}</div></div>` : ""}`;
function ask() {
  ui.screen = "quiz"; Q.attempt = 0; Q.hint = 0; Q.showKo = false; Q.posPick = ""; renderQ();

}
function renderQ() {
  const w = Q.items[Q.i], n = Q.items.length, p = posOf(w), listen = qmode(w) === "listen", defm = qmode(w) === "def", c = colorOf(w);

    const slots = [...w.en].map((ch, k) => ch === " " ? `<span class="gap"></span>` : `<span>${k < Q.hint ? esc(ch) : ""}</span>`).join("");
    card = `
      <span class="label">📖 영어 풀이를 읽고, 어떤 단어인지 맞혀요</span>
      <div class="def-text">${esc(w.def)}</div>

        <button class="tool" id="t-say">🔊 풀이 듣기</button>

      </div>`;
  } else if (listen) {
    const slots = [...w.en].map((ch, k) => ch === " " ? `<span class="gap"></span>` : `<span>${k < Q.hint ? esc(ch) : ""}</span>`).join("");
    const noVoice = !hasVoice("ko");
    card = `
      <div class="cover" style="--c:${c}" aria-label="${w.en.length}글자 영어 단어">${slots}</div>

      ${Q.showKo || noVoice ? `<div class="ko-text">${esc(w.ko)}</div>` : `<span class="note">한글 뜻을 듣고 영어로 써요</span>`}
      <div class="tools">
        <button class="tool" id="t-say">🔊 다시 듣기</button>
        ${Q.showKo || noVoice ? "" : `<button class="tool" id="t-ko">👀 글자로 보기</button>`}
        <button class="tool" id="t-hint" ${Q.hint >= w.en.length - 1 ? "disabled" : ""}>💡 힌트</button>

  } else {
    card = `<div class="prompt">${esc(w.en)}</div><div class="tools"><button class="tool" id="t-say">🔊 발음 듣기</button></div>`;

  const fields = defm ? defFields(w) : listen
    ? `<div class="field" id="f-en"><label for="ans-en">영어 단어</label><input id="ans-en" class="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>`
    : `<div class="field" id="f-ko"><label for="ans-ko">한글 뜻</label><input id="ans-ko" class="ko" autocomplete="off" enterkeyhint="next"></div>
       ${w.pos !== "etc" ? `<div class="field" id="f-pos"><label for="ans-pos">품사 (n · v · adj, 또는 명사 · 동사 · 형용사)</label><input id="ans-pos" class="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>` : ""}`;
  app.replaceChildren($(`
    ${bar(Q.i, n, Q.fix ? "한 번 더 고치기" : Q.box ? "🔀 랜덤 복습 (외운 단어)" : "2. 받아쓰기")}
    <div class="qcard">${card}</div>
    <form class="answer" id="form">${fields}<div id="fb"></div><button class="btn" type="submit" id="check">확인</button></form>`));
  document.getElementById("quit").onclick = home;
  document.getElementById("t-say").onclick = () => defm ? speak(w.def, "en") : listen ? sayKo(w) : speak(w.en, "en");
  app.querySelectorAll(".pick").forEach(b => b.onclick = () => {
    Q.posPick = b.dataset.p;

  if (defm) document.getElementById("ans-en").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && !document.getElementById("ans-ko").value.trim()) { e.preventDefault(); document.getElementById("ans-ko").focus(); } });
  const tko = document.getElementById("t-ko"); if (tko) tko.onclick = () => keep(() => { Q.showKo = true; });
  const th = document.getElementById("t-hint"); if (th) th.onclick = () => keep(() => { Q.hint = Math.min(Q.hint + 1, w.en.length - 1); while (w.en[Q.hint - 1] === " ") Q.hint++; });
  const ko = document.getElementById("ans-ko"), pos = document.getElementById("ans-pos");
  if (ko && pos) ko.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && ko.value.trim() && !pos.value.trim()) { e.preventDefault(); pos.focus(); } });

function keep(change) {

}
function check() {
  const w = Q.items[Q.i], listen = qmode(w) === "listen", defm = qmode(w) === "def";
  const en = document.getElementById("ans-en"), ko = document.getElementById("ans-ko"), pos = document.getElementById("ans-pos");
  const parts = [];
  if (defm) {
    parts.push({ f: "f-en", ok: normEn(en.value) === normEn(w.en), empty: !en.value.trim() });
    parts.push({ f: "f-ko", ok: koOk(ko.value, w.ko), empty: !ko.value.trim() });
    if (w.pos !== "etc") parts.push({ f: "f-pos", ok: Q.posPick === w.pos, empty: !Q.posPick });
  } else if (listen) parts.push({ f: "f-en", ok: normEn(en.value) === normEn(w.en), empty: !en.value.trim() });
  else { parts.push({ f: "f-ko", ok: koOk(ko.value, w.ko), empty: !ko.value.trim() }); if (pos) parts.push({ f: "f-pos", ok: posOk(pos.value, w.pos), empty: !pos.value.trim() }); }
  if (parts.every(x => x.empty)) { (en || ko).focus(); return; }
  parts.forEach(x => { const el = document.getElementById(x.f); el.classList.remove("bad", "good"); void el.offsetWidth; el.classList.add(x.ok ? "good" : "bad"); });
  const fb = document.getElementById("fb");
  if (parts.every(x => x.ok)) {
    const first = Q.attempt === 0;
    if (first) { S.stars++; delete S.wrong[wid(w)]; if (Q.fix) Q.fixOk++; else Q.firstOk++; } else if (Q.fix) Q.still.push(w);
    // 한 번에 맞힌 횟수를 세서 3번 연속이면 보관함으로
    let moved = false;
    if (first && !Q.fix && !Q.box && !isM(w)) {
      S.hits[wid(w)] = (S.hits[wid(w)] || 0) + 1;
      if (S.hits[wid(w)] >= MASTER_HITS) { master(w); Q.newlyM.push(w); moved = true; }
    }
    save(); speak(w.en, "en");
    fb.replaceChildren($(`<div class="feedback good"><span class="msg">${first ? "⭐ " + GOOD[Math.floor(Math.random() * GOOD.length)] : "잘 고쳤어요!"}</span><span>${esc(w.en)} = ${esc(w.ko)} · ${posOf(w).en} (${posOf(w).ko})</span>
      ${moved ? `<span class="display">🏆 ${MASTER_HITS}번 연속 맞혀서 '외운 단어 보관함'으로 옮겼어요!</span>`
        : (first && !Q.box && !isM(w) && S.hits[wid(w)]) ? `<span class="note">연속 ${S.hits[wid(w)]}번 맞힘 · ${MASTER_HITS}번이면 보관함으로</span>` : ""}</div>`));

    : `<div class="feedback bad"><span class="msg">정답을 보고 따라 써 봐요</span>

}
function between() {

/* ---------- 3. 내 문장 만들기 (복습) ---------- */
let V = null;
function startSent() {
  // 새로 올린 단어부터, 매번 다른 단어로
  const items = freshFirst(ACTIVE().length ? ACTIVE() : WORDS, SENT_ROUND);
  if (!items.length) return;
  V = { items, i: 0, text: "", ok: false, said: 0, felt: false };
  sentCard();
}
function sentOk(text, w) {
  const t = text.toLowerCase(), stem = w.en.toLowerCase().slice(0, Math.max(3, w.en.length - 2));

  if (!t.includes(stem)) return `문장에 ${w.en}을(를) 꼭 넣어 주세요.`;
  return "";
}
function sentCard() {
  ui.screen = "sent";

  const allDone = V.ok && V.said >= READ_TIMES && V.felt;
  app.replaceChildren($(`
    ${bar(V.i, n, "3. 내 문장 만들기")}
    <div class="qcard">
      <span class="badge" style="--c:${c}">${p.ko}</span>
      <div class="prompt">${esc(w.en)}</div>
      <div class="ko-text">${esc(w.ko)}</div>
      <div class="tools"><button class="tool" id="say">🔊 발음 듣기</button></div>
    </div>
    ${w.feel ? `<div class="feel"><span class="t">💡 이 단어의 느낌</span><span>${esc(w.feel)}</span></div>` : ""}
    <div class="panel">
      <span class="label">이렇게 써요 (누르면 소리가 나와요)</span>
      ${[[w.ex, w.exKo], [w.ex2, w.ex2Ko]].filter(x => x[0]).map(([e, k], i) => `
        <button class="example" data-ex="${i}" style="--c:${c};border:0;width:100%"><span class="en-s">${markWord(e, w)}</span><span class="ko-s">${esc(k)}</span></button>`).join("")}
    </div>
    <div class="panel">
      <h2>✏️ ${esc(w.en)}로 나만의 문장을 만들어요</h2>
      ${w.idea ? `<span class="note">힌트: ${esc(w.idea)}</span>` : ""}
      <textarea id="sent-text" placeholder="예: ${esc(w.ex || "I like " + w.en + ".")}" autocapitalize="sentences" spellcheck="false" ${V.ok ? "readonly" : ""}>${esc(V.text)}</textarea>
      <div id="sent-msg"></div>
      <button class="check" id="c-write" aria-pressed="${V.ok}"><span class="box">${V.ok ? "✓" : ""}</span><span>문장을 다 썼어요<small>${V.ok ? "고치고 싶으면 다시 눌러요" : "누르면 단어가 들어 있는지 확인해요"}</small></span></button>
      <div class="${V.ok ? "" : "locked"}" style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <span class="display" style="font-size:18px">${V.said >= READ_TIMES ? "✓ " : ""}내 문장을 크게 ${READ_TIMES}번 읽어요</span>
        <span class="note">읽을 때마다 동그라미를 눌러요 · 🔊 버튼으로 먼저 들어 봐도 좋아요</span>
        ${dotRow("say-dots", V.said, "내 문장", !V.ok)}
      </div>
      <div class="tools" ${V.ok ? "" : "hidden"}><button class="tool" id="say-mine">🔊 내 문장 듣기</button></div>
      <button class="check" id="c-feel" aria-pressed="${V.felt}" ${V.ok ? "" : "disabled"}><span class="box">${V.felt ? "✓" : ""}</span><span>예문과 비교해서 느낌을 알겠어요<small>내 문장도 위의 '느낌'과 잘 맞나요?</small></span></button>
    </div>
    <button class="btn" id="next" ${allDone ? "" : "disabled"}>${last ? "문장 만들기 끝!" : "다음 단어 ›"}</button>
  `));

  document.getElementById("say").onclick = () => speak(w.en, "en");

  };

}

/* ---------- 새 버전 자동 확인 ---------- */
// 앱을 열 때와 다시 화면에 나올 때 version.json을 확인해서, 새 버전이면 새 주소로 다시 열어요 (아이패드가 예전 화면을 붙잡고 있지 않게)
async function checkUpdate() {
  if (ui.screen !== "home") return;   // 공부 중에는 바꾸지 않아요
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const v = String((await r.json()).v || "");
    if (!v || v === APP_VERSION) return;
    if (sessionStorage.getItem("sew-tried") === v) return;   // 같은 버전으로 한 번만 시도
    sessionStorage.setItem("sew-tried", v);
    location.replace("./?v=" + encodeURIComponent(v));
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });

try { speechSynthesis.getVoices(); } catch (e) {}
home();
checkUpdate();
</script>
